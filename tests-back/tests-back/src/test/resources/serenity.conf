// serenity.conf
// Configuración de Serenity BDD para los tests del backend de Ajayu

headless.mode = true

// URL base de la API - CAMBIA ESTO si tu servidor está en otra dirección
webdriver.base.url = "http://localhost:3000"

// Ambiente
environments {
  default {
    webdriver.base.url = "http://localhost:3000"
    api.base.url = "http://localhost:3000/api"
    test.user.email = "test.ajayu@ejemplo.com"
    test.user.password = "TestPassword123!"
    admin.email = "admin.ajayu@ejemplo.com"
    admin.password = "AdminPassword123!"
  }
  dev {
    api.base.url = "http://localhost:3000/api"
  }
  staging {
    api.base.url = "https://ajayu-staging.com/api"
  }
  production {
    api.base.url = "https://ajayu.com/api"
  }
}

// Configuración de RestAssured a través de Serenity
restapi {
  baseurl = "http://localhost:3000/api"
}

// Reportes
serenity {
  take.screenshots = for_failures
  output.formats = ["html", "json"]
  reporting = ["stdout", "html"]
}
